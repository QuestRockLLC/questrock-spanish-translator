[project]
name = "questrock-sidecar"
version = "0.1.0"
description = "Local Spanish call-caption sidecar"
license = { file = "LICENSE" }
authors = [{ name = "Abbas Saeed Zaidi" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "websockets>=14",
  "pydantic-settings>=2.6",
  "faster-whisper>=1.1",
  "silero-vad>=5.1",
  "openai>=1.50",
  "numpy>=2.0",
  "soxr>=0.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
modal = ["modal>=0.73"]
windows = ["pyaudiowpatch>=0.2"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]
packaging = ["pyinstaller>=6.11"]

[project.scripts]
questrock-sidecar = "backend.main:run"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "audio*", "ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
