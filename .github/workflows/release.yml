name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Build AudioTap helper
        run: bash native/macos/build.sh
      - name: Install Python sidecar
        run: uv sync --extra packaging --extra dev
      - name: Install Electron
        working-directory: electron
        run: npm ci
      - name: Bundle sidecar
        working-directory: electron
        run: npm run sidecar
      - name: Package Mac installer
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          node ../packaging/check-sidecar.cjs darwin
          npm run build
          npx electron-builder --mac --config electron-builder.yml --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          if-no-files-found: error
          path: |
            electron/release/*.dmg
            electron/release/*.zip
            electron/release/*.blockmap
            electron/release/latest-mac.yml

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install Python sidecar
        run: uv sync --extra packaging --extra windows --extra dev
      - name: Install Electron
        working-directory: electron
        run: npm ci
      - name: Bundle sidecar
        working-directory: electron
        run: npm run sidecar
      - name: Package Windows installer
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          node ../packaging/check-sidecar.cjs win32
          npm run build
          npx electron-builder --win --config electron-builder.yml --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: win-installer
          if-no-files-found: error
          path: |
            electron/release/*.exe
            electron/release/*.blockmap
            electron/release/latest.yml

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create one GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f | sort)
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "QuestRock AI Assistant ${GITHUB_REF_NAME}"
